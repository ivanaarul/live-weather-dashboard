
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg,#141e30,#243b55);
    color: white;
    padding: 30px 15px;
}

.container {
    max-width: 950px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #cbd5e1;
    margin-bottom: 30px;
}

.search {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 30px;
}

input {
    width: 65%;
    max-width: 400px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    outline: none;
    font-size: 16px;
}

button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #082f49;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #7dd3fc;
}

.card {
    background: #ffffff18;
    backdrop-filter: blur(12px);
    border: 1px solid #ffffff25;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 8px 25px #0002;
}

.current {
    text-align: center;
}

.city {
    font-size: 25px;
    margin-bottom: 10px;
}

.icon {
    font-size: 65px;
    margin: 15px;
}

.temperature {
    font-size: 55px;
    font-weight: bold;
}

.condition {
    font-size: 19px;
    color: #bae6fd;
    margin: 10px;
}

.details {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 35px;
    margin-top: 25px;
}

.detail {
    font-size: 16px;
    color: #e0f2fe;
}

h2 {
    margin-bottom: 20px;
}

.forecast {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 12px;
}

.day {
    text-align: center;
    padding: 18px 8px;
    background: #ffffff15;
    border-radius: 15px;
    transition: 0.3s;
}

.day:hover {
    transform: translateY(-8px);
    background: #ffffff30;
}

.day-icon {
    font-size: 30px;
    margin: 12px 0;
}

.day p {
    margin: 7px 0;
}

#message {
    text-align: center;
    margin: 15px;
    color: #fca5a5;
}

@media(max-width:650px) {
    .forecast {
        grid-template-columns: repeat(2,1fr);
    }

    .temperature {
        font-size: 45px;
    }

    h1 {
        font-size: 26px;
    }

    .search {
        flex-wrap: wrap;
    }

    input {
        width: 100%;
    }

    .details {
        gap: 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🌤 Weather Dashboard</h1>
    <p class="subtitle">Discover the weather around you</p>

    <div class="search">
        <input type="text" id="city"
        placeholder="Enter city name..." value="Chennai">
        <button onclick="getWeather()">Search</button>
    </div>

    <p id="message"></p>

    <div class="card current">
        <h2 id="cityName" class="city">Chennai</h2>
        <p id="today"></p>
        <div id="icon" class="icon">🌤️</div>
        <div id="temp" class="temperature">--°C</div>
        <p id="condition" class="condition">Loading...</p>

        <div class="details">
            <p class="detail">💧 Humidity:
                <b id="humidity">--%</b></p>
            <p class="detail">💨 Wind:
                <b id="wind">-- km/h</b></p>
            <p class="detail">🌡 Feels like:
                <b id="feels">--°C</b></p>
        </div>
    </div>

    <div class="card">
        <h2>📅 5-Day Forecast</h2>
        <div id="forecast" class="forecast">
            <p>Loading forecast...</p>
        </div>
    </div>

</div>

<script>

const weatherInfo = {
    0: ["Clear Sky","☀️"],
    1: ["Mainly Clear","🌤️"],
    2: ["Partly Cloudy","⛅"],
    3: ["Overcast","☁️"],
    45: ["Fog","🌫️"],
    48: ["Fog","🌫️"],
    51: ["Light Drizzle","🌦️"],
    53: ["Drizzle","🌦️"],
    55: ["Heavy Drizzle","🌧️"],
    61: ["Light Rain","🌧️"],
    63: ["Rain","🌧️"],
    65: ["Heavy Rain","🌧️"],
    71: ["Light Snow","🌨️"],
    73: ["Snow","❄️"],
    75: ["Heavy Snow","❄️"],
    80: ["Rain Showers","🌦️"],
    81: ["Rain Showers","🌧️"],
    82: ["Heavy Showers","⛈️"],
    95: ["Thunderstorm","⛈️"],
    96: ["Thunderstorm","⛈️"],
    99: ["Thunderstorm","⛈️"]
};

function getInfo(code) {
    return weatherInfo[code] || ["Unknown","🌡️"];
}

async function getWeather() {

    const city = document.getElementById("city").value.trim();
    const message = document.getElementById("message");

    if (!city) {
        message.innerText = "Please enter a city name!";
        return;
    }

    message.innerText = "Loading weather...";
    
    try {

        const geoURL =
        `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`;

        const geoResponse = await fetch(geoURL);
        if (!geoResponse.ok) throw new Error("Location service unavailable");

        const geoData = await geoResponse.json();

        if (!geoData.results || !geoData.results.length) {
            throw new Error("City not found!");
        }

        const place = geoData.results[0];
        const lat = place.latitude;
        const lon = place.longitude;

        const weatherURL =
        `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;

        const response = await fetch(weatherURL);
        if (!response.ok) throw new Error("Weather service unavailable");

        const data = await response.json();

        document.getElementById("cityName").innerText =
        place.name + (place.admin1 ? ", " + place.admin1 : "");

        document.getElementById("today").innerText =
        new Date(data.current.time).toLocaleString();

        document.getElementById("temp").innerText =
        Math.round(data.current.temperature_2m) + "°C";

        document.getElementById("humidity").innerText =
        data.current.relative_humidity_2m + "%";

        document.getElementById("wind").innerText =
        data.current.wind_speed_10m + " km/h";

        document.getElementById("feels").innerText =
        Math.round(data.current.apparent_temperature) + "°C";

        const info = getInfo(data.current.weather_code);

        document.getElementById("icon").innerText = info[1];
        document.getElementById("condition").innerText = info[0];

        let output = "";

        for (let i = 0; i < 5; i++) {

            let day = new Date(data.daily.time[i] + "T12:00:00")
                .toLocaleDateString("en-US", {weekday:"short"});

            let forecastInfo = getInfo(data.daily.weather_code[i]);

            output += `
                <div class="day">
                    <p><b>${day}</b></p>
                    <div class="day-icon">${forecastInfo[1]}</div>
                    <p>${forecastInfo[0]}</p>
                    <p>⬆ ${Math.round(data.daily.temperature_2m_max[i])}°</p>
                    <p>⬇ ${Math.round(data.daily.temperature_2m_min[i])}°</p>
                </div>
            `;
        }

        document.getElementById("forecast").innerHTML = output;
        message.innerText = "";

    } catch(error) {
        message.innerText = error.message;
    }
}

document.getElementById("city").addEventListener("keydown", e => {
    if (e.key === "Enter") getWeather();
});

getWeather();

</script>

</body>
</html>
